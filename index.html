<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAMANN | In Kürze verfügbar</title>
<meta name="description" content="Anti-Financial Crime & Regulatory Compliance Consulting für Banken und Fintechs. Website im Aufbau." />
<meta name="robots" content="noindex" />
<style>
  :root{
    --navy-900:#0a1428; --navy-800:#0d1b34; --gold:#c9a55c; --gold-soft:#d8bd82;
    --ink:#e8ecf3; --muted:#9aa6bd; --line:rgba(201,165,92,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:32px;line-height:1.6;
    background:
      radial-gradient(900px 480px at 50% -10%,rgba(201,165,92,.14),transparent 60%),
      linear-gradient(180deg,var(--navy-800),var(--navy-900));
  }
  h1,.logo{font-family:Georgia,"Times New Roman",serif;font-weight:600}
  .wrap{max-width:560px}
  .logo{font-size:30px;letter-spacing:5px}
  .logo span{color:var(--gold)}
  .eyebrow{
    text-transform:uppercase;letter-spacing:2.5px;font-size:12px;color:var(--gold);
    font-weight:600;margin:14px 0 40px;
  }
  h1{font-size:clamp(30px,6vw,46px);margin-bottom:18px;letter-spacing:.3px}
  .lead{color:var(--muted);font-size:17px;margin-bottom:38px}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-block;padding:13px 26px;border-radius:8px;font-weight:600;font-size:15px;
    text-decoration:none;transition:.2s;
  }
  .btn-gold{background:var(--gold);color:var(--navy-900)}
  .btn-gold:hover{background:var(--gold-soft)}
  .btn-ghost{border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
  .divider{width:44px;height:1px;background:var(--line);margin:44px auto 20px}
  .foot{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">DA<span>M</span>ANN</div>
    <div class="eyebrow">Anti-Financial Crime &amp; Regulatory Compliance</div>

    <h1>In Kürze verfügbar</h1>
    <p class="lead">Die Website befindet sich im Aufbau. Für Anfragen zu AML-, AMLR/AMLA- und Payments-Compliance erreichen Sie mich jederzeit direkt.</p>

    <div class="actions">
      <!-- E-Mail und LinkedIn ggf. anpassen -->
      <a class="btn btn-gold" href="mailto:kontakt@damann-consulting.com">E-Mail schreiben</a>
      <a class="btn btn-ghost" href="https://www.linkedin.com/in/dein-profil" target="_blank" rel="noopener">LinkedIn</a>
    </div>

    <div class="divider"></div>
    <div class="foot">© <span id="y"></span> DAMANN Sp. z o.o. · Banking &amp; Fintech Compliance</div>
  </div>
  <script>document.getElementById("y").textContent=new Date().getFullYear();</script>
</body>
</html>
